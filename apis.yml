description: CrowdPlat, Inc. is a Pleasanton, California company (backed by 500 Global)
  that operates two platforms combining human expertise with AI. Its crowdsourcing
  marketplace connects enterprises with vetted specialists across 50+ countries for
  consulting, software development, R&D, and innovation challenges, delivered with
  US-based project management and milestone-driven scopes. Its AI Hire platform is
  recruitment technology that automates candidate evaluation through resume scoring,
  AI-generated screening questions, video interviews, and LinkedIn job promotion with
  auto-targeted outreach. Customers include federal agencies and enterprises such as
  Airbus, PayPal, and EPRI. No public developer/API program is published at this time.
